<!DOCTYPE html>
<html>
<head>
    <title>Library Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 40px;
        }
        h1 { text-align: center; }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 180px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        th { background: #333; color: white; }
        tr:hover { background: #f1f1f1; }
        .actions button { margin: 0 4px; }

        .navbar {
            text-align: center;
            margin-bottom: 20px;
}
        .navbar button {
            margin: 0 10px;
            padding: 10px 18px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
        }
        .navbar button:hover {
            background: #555;
        }
    </style>
</head>
<body>

<h1>📚 Library Management System</h1>

<div class="navbar">
    <button onclick="showSection('add')">Add Book</button>
    <button onclick="showSection('search')">Search Books</button>
    <button onclick="showSection('rent')">Rent Book</button>
    <button onclick="showSection('records')">Records</button>
</div>

<!-- Add Book -->
<div id="add" class="card section">
    <h3>Add Book</h3>
    <input id="sn" placeholder="Serial Number">
    <input id="title" placeholder="Title">
    <input id="author" placeholder="Author">
    <input id="price" placeholder="Price">
    <button onclick="addBook()">Add Book</button>
</div>

<!-- Search -->
<div id="search" class="card section" style="display:none;">
    <h3>Search Books</h3>
    <input id="searchAuthor" placeholder="Search by Author">
    <input id="searchTitle" placeholder="Search by Title">
    <button onclick="searchBooks()">Search</button>
    <button onclick="loadBooks()">View All</button>
</div>

<!-- Rent -->
<div id="rent" class="card section" style="display:none;">
    <h3>Rent a Book</h3>
    <input id="rentSN" placeholder="Serial Number">
    <input id="renterName" placeholder="Renter Name">
    <input id="contact" placeholder="Contact Number">
    <input id="amount" placeholder="Amount Paid">
    <button onclick="submitRent()">Rent Book</button>
</div>

<!-- Records -->
<div id="records" class="card section" style="display:none;">
    <h3>Book Records</h3>
    <table>
        <thead>
            <tr>
                <th>SN</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="bookTable"></tbody>
    </table>
</div>

<script>
const API = "/api/books/";

/* ---------- NAVIGATION ---------- */
function showSection(id) {
    document.querySelectorAll('.section').forEach(sec => {
        sec.style.display = "none";
    });
    document.getElementById(id).style.display = "block";
}

/* ---------- TABLE RENDER (ONLY PLACE THAT TOUCHES TABLE) ---------- */
function renderTable(data) {
    const table = document.getElementById("bookTable");
    table.innerHTML = "";

    data.forEach(b => {
        table.innerHTML += `
        <tr>
            <td>${b.serial_number}</td>
            <td>${b.title}</td>
            <td>${b.author}</td>
            <td>₹${b.price}</td>
            <td class="actions">
                <button onclick="editBook('${b.serial_number}', '${b.price}')">Edit</button>
                <button onclick="rentBook('${b.serial_number}')">Rent</button>
                <button onclick="deleteBook('${b.serial_number}')">Delete</button>
            </td>
        </tr>`;
    });
}

/* ---------- LOAD ALL BOOKS ---------- */
function loadBooks() {
    fetch(API)
        .then(res => res.json())
        .then(data => {
            showSection('records');
            renderTable(data);
        });
}

/* ---------- SEARCH BOOKS (PARTIAL WORKS) ---------- */
function searchBooks() {
    let author = searchAuthor.value.trim();
    let title = searchTitle.value.trim();

    let url = API;

    if (author || title) {
        const params = new URLSearchParams();
        if (author) params.append("author", author);
        if (title) params.append("title", title);
        url += "?" + params.toString();
    }

    fetch(url)
        .then(res => res.json())
        .then(data => {
            showSection('records');
            renderTable(data);
        });
}

/* ---------- ADD BOOK ---------- */
function addBook() {
    fetch(API, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            serial_number: sn.value,
            title: title.value,
            author: author.value,
            price: price.value
        })
    }).then(() => {
        clearInputs();
        loadBooks();
    });
}

/* ---------- DELETE ---------- */
function deleteBook(sn) {
    fetch(API + sn + "/", { method: "DELETE" })
        .then(() => loadBooks());
}

/* ---------- EDIT ---------- */
function editBook(sn, oldPrice) {
    let newPrice = prompt("Enter new price:", oldPrice);
    if (newPrice) {
        fetch(API + sn + "/", {
            method: "PATCH",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ price: newPrice })
        }).then(() => loadBooks());
    }
}

/* ---------- RENT ---------- */
function rentBook(sn) {
    showSection('rent');
    rentSN.value = sn;
}

function submitRent() {
    fetch("/api/rent/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            book_sn: rentSN.value,
            renter_name: renterName.value,
            contact_number: contact.value,
            amount_paid: amount.value
        })
    }).then(() => {
        alert("Book Rented Successfully");
        loadBooks();
    });
}

/* ---------- CLEAR INPUTS ---------- */
function clearInputs() {
    sn.value = "";
    title.value = "";
    author.value = "";
    price.value = "";
}

/* ---------- START ON ADD BOOK TAB ---------- */
showSection('add');
</script>

</body>
</html>
